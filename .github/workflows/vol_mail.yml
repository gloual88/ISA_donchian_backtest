name: KOSPI Vol Mail

# 평일 한국장 마감 후 — 백업 포함 2회 예약. 같은 종가일은 1통만 발송.
#   09:45 UTC = 18:45 KST (1차) / 11:15 UTC = 20:15 KST (백업)
on:
  schedule:
    - cron: "45 9 * * 1-5"
    - cron: "15 11 * * 1-5"
  workflow_dispatch:      # 수동 실행 — 시험 발송 옵션
    inputs:
      subject_prefix:
        description: "제목 접두 (시험 발송: [시험] )"
        required: false
        default: ""
      force_email:
        description: "중복방지 무시 강제 발송 (1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vol-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas numpy yfinance

      - name: Send volatility mail
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          VOL_MAIL_TO: ${{ secrets.VOL_MAIL_TO }}
          SUBJECT_PREFIX: ${{ github.event.inputs.subject_prefix }}
          FORCE_EMAIL: ${{ github.event.inputs.force_email }}
        run: python vol_mail/vol_mail.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vol_mail/kospi_close.csv vol_mail/last_sent.txt
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: vol mail $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 10
            done
          fi
